# www.badgersupports.org — Netlify configuration. Nothing here publishes or turns anything on. The
# owner deploys from the laptop with the setup files (WORK.md, owner actions): the draft (file 4) uploads
# dist/ alone; the main address (file 6) runs this build on the laptop through Netlify's command line,
# which also creates the Netlify Database and applies netlify/database/migrations/. The repository is
# never linked to Netlify, so nothing builds on Netlify's machines.
#
# The build below is the PROTOTYPE build (fixtures allowed, noindex everywhere): what a deploy
# preview would show. What a preview or deploy costs on this account is unverified (docs/ARCHITECTURE.md).
# Releases are built on the owner's laptop, which holds the photo originals (owner, 20 Oct 2026;
# docs/DESIGN.md, "Building away from the laptop"). A Netlify build machine has no local/, so there the
# build stops before encoding and lists every photo whose original is in the shared Drive. The production build
# (`node ops/build.mjs --production`) refuses to run until Connect's public event export, its public
# team export and the moderated Wall source exist, and until the pages still on the live site have
# been rebuilt here.

[build]
  command = "node ops/build.mjs --fetch-media"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # The API renders no-JavaScript replies with the same assets and words the build used, and
  # applies the same migrations the local rig does.
  # PGlite is the local rig's database (LOCAL_DB=pglite) and must never ship. The packer traces its
  # import anyway, so the "!" line is what keeps it out: measured 20 October 2026, the bundle drops
  # from 20 MB to 2 MB and the API still answers. The other three are build and test tools.
  included_files = [".build/server.json", "netlify/database/migrations/**", "!node_modules/@electric-sql/**"]
  ignored_node_modules = ["@electric-sql/pglite", "playwright", "axe-core", "sharp"]
