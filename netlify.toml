# www.badgersupports.org — Netlify configuration. Nothing here publishes or turns anything on. The
# owner publishes from the laptop with ../PUBLISH-WEBSITE-2026-10-23.command, which runs the production
# build below on the laptop through Netlify's command line (`--context production`); that also creates the
# Netlify Database and applies netlify/database/migrations/. The site IS linked to this repository
# (Netlify holds it as a git site following the main branch), so a push would start a build on Netlify's
# machines if anything let it; the ignore line under [build] below is what does not let it. Publishing is
# the laptop flow only — a build on Netlify's machines has no photo originals and no publish key, and by
# design it stops and names what is missing rather than publishing something lesser.
#
# Two builds (owner, 23 Oct 2026: "have it be the live site, I want it to be actually connected to Connect"):
#   production  `--production`: the live site. Events and resources are read from Connect when it builds
#               (ops/connect-feed.mjs): CONNECT_URL and PUBLIC_SITE_SERVICE_KEY_ID from the project, and
#               the key from the publish file as PUBLISH_SERVICE_SECRET (Netlify gives laptop builds a stand-in). If Connect
#               cannot be read, nothing is built and the deploy already online stays. Forms are served closed,
#               each linking its Google Form (owner, 20 Oct); pages are indexable.
#   otherwise   the prototype build (hand-typed fixtures, noindex everywhere): what a deploy preview shows,
#               and what the publish file's one-off database preview uses.
# What a preview or deploy costs on this account is unverified (docs/ARCHITECTURE.md). Releases are built on
# the owner's laptop, which holds the photo originals (owner, 20 Oct 2026; docs/DESIGN.md, "Building away from
# the laptop"). A Netlify build machine has no local/, so there the build stops before encoding and lists
# every photo whose original is in the shared Drive.

[build]
  command = "node ops/build.mjs --fetch-media"
  publish = "dist"
  functions = "netlify/functions"
  # No build ever runs on Netlify's machines (owner's model above: releases are built on the laptop, which
  # holds the photo originals). The ignore command is the switch Netlify's own build system reads before
  # building a pushed commit: it always succeeds, so every build a push starts is set aside at once, before
  # anything is built or published. It is read only by that system — the laptop's own builds and deploys
  # through Netlify's command line do not consult it — and [skip netlify] in a commit message stays in use
  # as well, as a second, visible signal. Set 13 November 2026, after a push-triggered build failed on
  # Netlify's machines against settings this repository does not carry.
  ignore = "true"

[context.production]
  command = "node ops/build.mjs --production --fetch-media"

# The production build — and only it — is given the organisation's Google Analytics
# measurement id (owner's ruling, 12 Nov 2026: GA on every page, enhanced measurement on;
# the id was supplied by the owner that day). ops/build.mjs reads GA_MEASUREMENT_ID and,
# only when it is set, bakes the bss-analytics configuration into the pages and widens
# the Content Security Policy by Google's own host list for the tag. The id is not a
# secret: it is printed in every measured page. Prototype and preview builds are given
# no id, so they still measure nothing (docs/ANALYTICS.md).
[context.production.environment]
  GA_MEASUREMENT_ID = "G-XVT9XWRVQ5"

[build.environment]
  NODE_VERSION = "22"

# Stops a deploy whose build didn't pack every migration, before it publishes (netlify/plugins/migrations-guard).
# Badger SPILL's guard: on 16 October 2026 three of its builds carried none and published code ahead of the database.
[[plugins]]
  package = "./netlify/plugins/migrations-guard"

[functions]
  node_bundler = "esbuild"
  # The API renders no-JavaScript replies with the same assets and words the build used, and
  # applies the same migrations the local rig does.
  # PGlite is the local rig's database (LOCAL_DB=pglite) and must never ship. The packer traces its
  # import anyway, so the "!" line is what keeps it out: measured 20 October 2026, the bundle drops
  # from 20 MB to 2 MB and the API still answers. The other three are build and test tools.
  # The page function (functions/pages.mjs) answers with the build's own page when the published revision
  # cannot be read, so it carries the built pages too (docs/ARCHITECTURE.md, "Publishing a save").
  included_files = [".build/server.json", "netlify/database/migrations/**", "dist/**/*.html", "!node_modules/@electric-sql/**"]
  ignored_node_modules = ["@electric-sql/pglite", "playwright", "axe-core", "sharp"]
